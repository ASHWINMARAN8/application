name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release JOE Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
      working-directory: android_app

    - name: Prepare APK Release Asset
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JOE-Tactical-AI-v1.0.0.apk
      working-directory: android_app

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JOE-Tactical-AI-Debug-APK
        path: android_app/app/build/outputs/apk/debug/JOE-Tactical-AI-v1.0.0.apk

    - name: Publish APK to GitHub Releases
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "⚡ JOE — Tactical Voice AI Assistant v1.0.0 (Android APK)"
        body: |
          ## ⚡ JOE — Tactical Voice AI Assistant (E.D.I.T.H. Engine)
          ### 100% Offline Personal Voice AI for Android (English, தமிழ் & Tanglish)

          ### 📲 Direct APK Download:
          Download and install the APK directly onto your Android device:
          - **[JOE-Tactical-AI-v1.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/JOE-Tactical-AI-v1.0.0.apk)**

          ---

          ### 🌟 Key Capabilities:
          - 🎙️ **100% Offline Voice Automation**: Zero internet required, zero cloud latency, 100% private.
          - 🗣️ **Trilingual Voice Cadence**: Understands and speaks conversational **Tanglish**, pure **Tamil (தமிழ்)**, and **English**.
          - 🔦 **Hardware & System Controls**: Torch/Flashlight, Dials Phone Calls, WhatsApp launcher, App Launcher, Volume adjustments, Lock screen, and battery telemetry.
          - 🔓 **Touchless Screen Unlock**: Wake and dismiss device keyguards touchlessly using your voice.
          - 🎭 **Dual Stark Persona**:
            - **JOE (E.D.I.T.H. Tactical)**: Tactical Neon Red HUD inspired by Spider-Man's E.D.I.T.H. glasses.
            - **JOE (Executive)**: Arc Reactor Cyan HUD for executive control.

          ---

          ### ⚙️ How to Install on Your Android Phone:
          1. Tap the download link above: **[JOE-Tactical-AI-v1.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/JOE-Tactical-AI-v1.0.0.apk)**.
          2. Open the downloaded file and tap **Install** (if prompted, enable *"Install from Unknown Sources"* or *"Allow from this source"*).
          3. Launch **JOE Assistant**, grant **Microphone**, **Call**, **SMS**, and **Camera** permissions.
          4. Tap **"ENABLE ACCESSIBILITY AUTOMATION"** to allow touchless automation.
          5. In phone **Settings → System → Languages & Input → Text-to-speech output**, verify that offline voice packages (English India & Tamil India) are installed.
        files: |
          android_app/app/build/outputs/apk/debug/JOE-Tactical-AI-v1.0.0.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
