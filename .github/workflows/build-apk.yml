name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release SIU Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: android_app

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      working-directory: android_app

    - name: Extract Error on Failure
      if: failure()
      run: |
        tail -n 250 build.log > build_summary.txt
        echo "### ⚠️ Android Build Failure Diagnostics" >> build_summary.txt
        echo '```' >> build_summary.txt
        tail -n 120 build.log >> build_summary.txt
        echo '```' >> build_summary.txt
      working-directory: android_app

    - name: Publish Diagnostics to Release on Failure
      if: failure()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "🔴 SIU Build Diagnostic Report"
        body_path: android_app/build_summary.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare APK Release Assets
      if: success()
      run: |
        mkdir -p release_assets
        echo "Listing all generated APK files:"
        find . -name "*.apk"
        APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
        echo "Copying APK from: $APK_FILE"
        cp "$APK_FILE" release_assets/SIU-Offline-AI-v1.0.0.apk
        cp "$APK_FILE" release_assets/Alexa-Offline-AI-v1.0.0.apk
        cp "$APK_FILE" release_assets/JOE-Tactical-AI-v1.0.0.apk
        ls -la release_assets/
      working-directory: android_app

    - name: Upload APK as Workflow Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SIU-Offline-AI-Debug-APK
        path: android_app/release_assets/SIU-Offline-AI-v1.0.0.apk

    - name: Publish APK to GitHub Releases
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "🔵 SIU — Offline Voice AI Assistant v1.0.0 (Android APK)"
        body: |
          ## 🔵 SIU — Offline Voice AI Assistant
          ### 100% Offline Personal Voice AI for Android (English, தமிழ் & Tanglish)

          ### 📲 Direct APK Download:
          Download and install the APK directly onto your Android device:
          - **[SIU-Offline-AI-v1.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/SIU-Offline-AI-v1.0.0.apk)**

          ---

          ### 🌟 Key Capabilities:
          - 🎙️ **100% Offline Voice Automation**: Zero internet required, zero cloud latency, 100% private on-device execution.
          - 🗣️ **Trilingual Voice Cadence**: Understands and speaks conversational **Tanglish**, pure **Tamil (தமிழ்)**, and **English**.
          - 🔦 **Hardware & System Controls**: Torch/Flashlight, Dials Phone Calls, WhatsApp launcher, App Launcher, Volume adjustments, Lock screen, timers, and battery telemetry.
          - 🔓 **Touchless Screen Unlock**: Wake and dismiss device keyguards touchlessly using your voice ("Siu, phone ah unlock pannu").
          - 🔵 **SIU Core & Pro Personas**:
            - **SIU Core**: Signature Cyan & Deep Electric Blue glowing ring.
            - **SIU Pro**: Amber Gold smart display hub theme.
          - ⚡ **Low-End Phone Optimized**: Operates on < 14MB RAM, < 2ms latency on 2GB-3GB RAM devices.
        files: |
          android_app/release_assets/SIU-Offline-AI-v1.0.0.apk
          android_app/release_assets/Alexa-Offline-AI-v1.0.0.apk
          android_app/release_assets/JOE-Tactical-AI-v1.0.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
