name: Build & Host Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
      working-directory: android_app

    - name: Prepare APK Release Asset
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AIDA-IronAssistant-v1.0.0.apk
      working-directory: android_app

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDA-IronAssistant-Debug-APK
        path: android_app/app/build/outputs/apk/debug/AIDA-IronAssistant-v1.0.0.apk

    - name: Publish APK to GitHub Releases
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "A.I.D.A. Assistant v1.0.0 (JARVIS & EDITH)"
        body: |
          ## ⚡ A.I.D.A. — JARVIS & E.D.I.T.H.
          ### 100% Offline Personal Voice AI for Android (English, தமிழ் & Tanglish)

          ### 📲 Direct APK Download
          Download and install the APK directly onto your Android device:
          - **[AIDA-IronAssistant-v1.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/AIDA-IronAssistant-v1.0.0.apk)**

          ### 🌟 Key Features:
          - 🎙️ **100% Offline Voice Assistant**: Zero internet, zero data, 100% private.
          - 🗣️ **Trilingual Natural Speech**: Conversational Tanglish (*"Torch on panniten boss!"*), pure Tamil (தமிழ்), and English.
          - 🔦 **System Automation**: Flashlight/Torch, Phone Calls, WhatsApp Messages, App Launcher, Volume, Lock Screen, and Battery telemetry.
          - 🎭 **Dual Stark Persona**: Switch between **JARVIS** (Arc Reactor Cyan HUD) and **EDITH** (Tactical Red HUD).

          ### ⚙️ Quick Installation Guide:
          1. Download the `.apk` file above.
          2. Tap to install (enable "Install from Unknown Sources" if prompted).
          3. Grant **Microphone**, **Call**, **SMS**, and **Camera** permissions.
          4. Enable **Accessibility Service** when prompted for automated phone interactions.
          5. In phone **Settings → System → Languages & Input → Text-to-speech**, verify that offline speech engines (English India & Tamil India) are installed.
        files: |
          android_app/app/build/outputs/apk/debug/AIDA-IronAssistant-v1.0.0.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
